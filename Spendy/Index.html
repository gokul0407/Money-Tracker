<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="spendy">SPENDY </h1>

    <p class="spendy-subtitle">
        Track &nbsp; • &nbsp; Save &nbsp; • &nbsp; Grow
    </p>
    <div class="container">

        <div class="ledger">
            <h2>Income</h2>
            <h4>Balance</h4>
            <h1 id="balance">₹ 0</h1>

            <div class="inc-exp-container">
                <div class="inc">
                    <h4>Income</h4>
                    <p id = "inc-amt" class = "amt plus">₹ 0</p>
                </div>
                <div class="exp">
                    <h4>Expenses</h4>
                    <p id = "exp-amt" class = "amt minus">₹ 0</p>
                </div>
            </div>
            <form action="#" id="form">
                <div class="form-con">
                    <label for="desc">Description</label>
                    <input type="text" name="desc" id="desc" placeholder="Enter Description"/>
                </div>

                <div class="form-con">
                    <label for="amt">Amount</label>
                    <input type="text" name="amt" id="amt" placeholder="Enter Amount"/>
                </div>
                <button class="btn" type="submit">Add Transaction</button>
                
            </form>
            
        </div>

        <div class="transaction">
            <h3>Transaction History</h3>
            <ul class="trans" id="trans">
                <!--
                <li class="exp">Insurance
                    <span>-1500</span>
                    <button class="delete-btn">x</button>
                </li>
                <li class="inc">Salary
                    <span>+50000</span>
                    <button class="delete-btn">x</button>
                </li>
                <li class="exp">Food
                    <span>-500</span>
                    <button class="delete-btn">x</button>
                </li>
                -->
            </ul>
        </div>
    </div>

    <script src="scripts.js"></script>

</body>

</html>
